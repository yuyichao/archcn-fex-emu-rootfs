name: Weekly tag

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      # Reset the inactivity counter so that GitHub doesn't disable the schedule
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable tag.yml

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(date -u +%Y%m%d)
          # Skip if the tag was already created (e.g. manually)
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists"
            exit 0
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
          # Tags pushed with GITHUB_TOKEN don't trigger the release workflow
          gh workflow run release.yml --ref "$tag"
