name: Release rootfs

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]']
  # Run on a tag ref
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag name
        run: |
          if [[ ! $GITHUB_REF =~ ^refs/tags/[0-9]{8}$ ]]; then
            echo "::error::$GITHUB_REF is not a date tag (YYYYMMDD)"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rootfs
          path: out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/default.erofs.zst out/pkglist.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Arch Linux x86_64 rootfs for FEX-Emu, built on $(date -u +%F)."
